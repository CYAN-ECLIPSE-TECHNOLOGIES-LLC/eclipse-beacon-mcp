# LEGACY packaging workflow — MANUAL DISPATCH ONLY.
#
# TAG PUSHES ARE FORBIDDEN HERE (CT-D2, Verity card
# container-train-2026-10-26): do NOT add a push/tags trigger to this
# workflow. A v* tag push previously fired this workflow and published
# UNSIGNED ghcr.io images tagged 'latest' + <sha> — no cosign, no
# SBOM/provenance, smoke AFTER the push — bypassing the Container
# Train's CONTAINER_TRAIN_PUBLISH switch and its smoke-before-push
# gate (gate A3/A5: "no unsigned latest, ever"). Concrete collision:
# the approved PyPI publish fires on the v0.1.0 tag; that same tag
# must NOT publish an unsigned GHCR 'latest'. The Container Train
# release-images.yml is the ONLY sanctioned image publish path.
# This file is retained for manual workflow_dispatch only because the
# train workflow is not yet installed in this repo.
name: Package
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cyan-eclipse-technologies-llc/eclipse-beacon-mcp:latest
            ghcr.io/cyan-eclipse-technologies-llc/eclipse-beacon-mcp:${{ github.sha }}
      - name: Smoke (MCP initialize handshake)
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' | docker run -i ghcr.io/cyan-eclipse-technologies-llc/eclipse-beacon-mcp:${{ github.sha }} | grep -q '"result"'
